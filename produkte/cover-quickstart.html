<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover: KI-Quickstart Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }
        .cover {
            width: 600px;
            height: 800px;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }
        .cover::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(201, 169, 98, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(201, 169, 98, 0.1) 0%, transparent 40%);
        }
        .accent-line {
            position: absolute;
            top: 80px;
            left: 60px;
            right: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a962, transparent);
        }
        .accent-line-bottom {
            position: absolute;
            bottom: 80px;
            left: 60px;
            right: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a962, transparent);
        }
        .logo {
            position: absolute;
            top: 100px;
            font-size: 14px;
            letter-spacing: 4px;
            color: #c9a962;
            font-weight: 600;
            z-index: 1;
        }
        .icon {
            font-size: 140px;
            margin-bottom: 40px;
            z-index: 1;
            filter: drop-shadow(0 10px 30px rgba(201, 169, 98, 0.3));
        }
        .title {
            font-family: 'Georgia', serif;
            font-size: 56px;
            color: #fff;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 20px;
            z-index: 1;
        }
        .title span {
            color: #c9a962;
            font-style: italic;
        }
        .subtitle {
            font-size: 24px;
            color: rgba(255,255,255,0.7);
            text-align: center;
            z-index: 1;
        }
        .features {
            position: absolute;
            bottom: 140px;
            display: flex;
            gap: 30px;
            z-index: 1;
        }
        .feature {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
        }
        .feature strong {
            display: block;
            color: #c9a962;
            font-size: 20px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="accent-line"></div>
        <div class="logo">KI-EXPERTENRAUM PREMIUM</div>
        <div class="icon">🚀</div>
        <h1 class="title">KI-Quickstart<br><span>Guide</span></h1>
        <p class="subtitle">In 10 Minuten zur ersten KI-Nutzung</p>
        <div class="features">
            <div class="feature">
                <strong>7</strong>
                Tage Plan
            </div>
            <div class="feature">
                <strong>10</strong>
                Fehler vermeiden
            </div>
            <div class="feature">
                <strong>3</strong>
                Tools im Vergleich
            </div>
        </div>
        <div class="accent-line-bottom"></div>
    </div>
</body>
</html>
